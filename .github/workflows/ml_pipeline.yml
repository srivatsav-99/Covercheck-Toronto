name: CoverCheck ML Pipeline

on:
  push:
    branches:
      - main
      - feature/stage-e-mlops-upgrade
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root

      - name: Run tests
        run: pytest -q

      - name: Validate pipeline imports
        run: |
          python -c "from src.scoring.score_latest import score_latest; print('score_latest import OK')"
          python -c "from src.monitoring.monitor_model import generate_alerts; print('monitoring import OK')"
          python -c "from src.pipeline.run_pipeline import main; print('pipeline import OK')"
          python -c "from src.registry.promote_model import promote_candidate; print('promotion import OK')"

      - name: Validate monitoring alert logic
        run: |
          python - <<'PY'
          from src.monitoring.monitor_model import generate_alerts

          report = {
              "timestamp": "ci-test",
              "freshness": {"days_since_update": 30},
              "prediction_drift": {"surge_avg": 0.05, "nbhd_avg": 0.50},
          }

          alerts = generate_alerts(report)
          assert alerts["status"] == "ALERT"
          assert alerts["alert_count"] == 1
          assert alerts["alerts"][0]["type"] == "artifact_freshness"

          print("monitoring alert logic OK")
          PY